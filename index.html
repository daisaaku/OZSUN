<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おじさん寿司フェスティバル</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            overflow: hidden;
            font-family: monospace;
            user-select: none;
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0b0b1a 0%, #1a0515 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
        }

        .glitch-char {
            display: inline-block;
            transform: scaleY(-1);
            color: #ff0055;
        }

        .start-btn {
            margin-top: 35px;
            padding: 15px 45px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            transition: transform 0.1s, background 0.2s;
        }
        .start-btn:hover {
            background: #ff3377;
            transform: scale(1.05);
        }

        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ff0000;
            pointer-events: none;
            z-index: 10;
            background: rgba(10, 0, 0, 0.85);
            padding: 12px 18px;
            border-left: 4px solid #ff0000;
            text-shadow: 2px 2px #000;
        }

        #horror-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #e61d25;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .glitch-tv {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: flash 0.02s infinite;
        }

        .scary-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            animation: shake 0.01s infinite;
        }

        @keyframes flash {
            0% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.4; filter: brightness(2); }
            100% { opacity: 0.9; filter: brightness(0.5); }
        }

        @keyframes shake {
            0% { transform: translate(25px, 20px) scale(1.15) rotate(2deg); }
            50% { transform: translate(-25px, -20px) scale(0.9) rotate(-2deg); }
            100% { transform: translate(15px, -15px) scale(1.05) rotate(1deg); }
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="font-size: 38px; color: #00ffff; text-shadow: 0 0 15px rgba(0,255,255,0.5);">
        お<span class="glitch-char">じ</span>さん寿司フェスティバル
    </h1>
    
    <p id="notice-text" style="color: #a0a0c0; font-size: 14px; margin-top: 10px;">[注意: 本作はフィクションです。実在する人物、団体、事件等には一切関係ありません。]</p>
    
    <button class="start-btn" onclick="startGameWithJumpScare()">GAME START</button>

    <div style="position: absolute; bottom: 20px; color: #404060; font-size: 11px;">
        v1.0.4 - © 202X [だれかみている]
    </div>
</div>

<div id="ui-overlay">
    <div id="ui-title" style="font-size:22px; font-weight:bold; color:#ff0055;">TITLE: おじさん寿司フェスティバル</div>
    <div id="ui-status">STATUS: 異常</div>
    <div id="score" style="font-size:18px; color:#ff3333; margin-top:5px;">肉片回収数: 0</div>
</div>

<div id="horror-overlay">
    <div class="glitch-tv">
        <img src="horror.png" class="scary-img" alt="HORROR">
    </div>
</div>

<audio id="announcement-audio" src="アナウンス.mp3" preload="auto"></audio>

<script>
const config = {
    type: Phaser.WEBGL,
    width: window.innerWidth,
    height: window.innerHeight,
    transparent: true,
    scene: { create: create, update: update }
};

const game = new Phaser.Game(config);
let corePoly, laser, meats = [], score = 0, scoreText;
let phaserScene = null;
let gameStarted = false;

setInterval(() => {
    if (gameStarted) return;
    const notice = document.getElementById('notice-text');
    const alters = [
        "[注意: 本作はフィクションです。実在する人物、団体、事件等には一切関係ありません。]",
        "[注意: 本作はフィクションです。実在する人物、団体、事件等には一切関係ありま....ｓ]",
        "[注意: 本作はフィクションです。実在する人物、団体、事件等には一切関係ありす。]",
        "[注意: 本作はフィクションでやんす。実在する人物、団体、事件等には一切関係ありません。]"
    ];
    notice.innerText = alters[Math.floor(Math.random() * alters.length)];
}, 2500);

function create() {
    phaserScene = this;

    let graphics = this.make.graphics({x:0, y:0, add:false});
    graphics.lineStyle(3, 0xff0000);
    graphics.strokeRect(0, 0, 32, 32);
    graphics.generateTexture('meatTex', 32, 32);

    corePoly = this.add.mesh(config.width / 2, config.height / 2, 'meatTex');
    corePoly.panZ(250);

    laser = this.add.rectangle(config.width / 2, config.height - 50, 90, 14, 0xff0000);

    this.time.addEvent({
        delay: 250,
        callback: () => {
            if (!gameStarted) return;
            let m = this.add.text(Phaser.Math.Between(50, config.width - 50), -20, '🥩', { fontSize: '24px' });
            meats.push(m);
        },
        loop: true
    });

    this.cursors = this.input.keyboard.createCursorKeys();
    scoreText = document.getElementById('score');

    setInterval(() => {
        if (!gameStarted) return;
        const bugs = [
            "助けて…ここにいる…",
            "お前は誰だ",
            "見ているぞ",
            "寿司などない",
            "逃げられない"
        ];
        let randomBug = bugs[Math.floor(Math.random() * bugs.length)];
        document.getElementById('ui-status').innerText = `STATUS: ${randomBug}`;
    }, 3000);

    setInterval(() => {
        if (!gameStarted) return;
        if (Math.random() < 0.3) {
            triggerRandomFlash();
        }
    }, 7000);
}

function update() {
    if (!corePoly || !gameStarted) return;

    corePoly.modelRotation.x += 0.03;
    corePoly.modelRotation.y += 0.05;

    if (this.cursors.left.isDown) laser.x = Math.max(45, laser.x - 12);
    if (this.cursors.right.isDown) laser.x = Math.min(config.width - 45, laser.x + 12);

    for (let i = meats.length - 1; i >= 0; i--) {
        let m = meats[i];
        m.y += 8;

        if (Math.abs(m.x - laser.x) < 50 && Math.abs(m.y - laser.y) < 20) {
            m.destroy();
            meats.splice(i, 1);
            score += 666;
            scoreText.innerText = `肉片回収数: ${score}`;
        } else if (m.y > config.height) {
            m.destroy();
            meats.splice(i, 1);
        }
    }
}

function startGameWithJumpScare() {
    document.getElementById('start-screen').style.display = 'none';

    if (phaserScene) {
        phaserScene.cameras.main.shake(1000, 0.12);
    }
    
    const horrorOverlay = document.getElementById('horror-overlay');
    horrorOverlay.style.display = 'flex';

    setTimeout(() => {
        horrorOverlay.style.display = 'none';
        gameStarted = true;
        
        const audio = document.getElementById('announcement-audio');
        audio.currentTime = 0;
        audio.play().catch(e => {
            console.log("音声の自動再生ブロック:", e);
        });
    }, 2500);
}

function triggerRandomFlash() {
    const overlay = document.getElementById('horror-overlay');
    overlay.style.display = 'flex';
    if (phaserScene) {
        phaserScene.cameras.main.shake(400, 0.08);
    }
    setTimeout(() => {
        overlay.style.display = 'none';
    }, 200);
}
</script>
</body>
</html>
